server.port=8084

# Local Microservice URLs
user.service.url=http://localhost:8081/sales-user

# MySQL Local Connection
spring.datasource.url=jdbc:mysql://localhost:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# JWT Settings (Short TTL for testing token refresh logic)
jwt.issuer=leadsphere-auth-dev
jwt.audience=leadsphere-clients-dev
jwt.access-token-ttl=900
jwt.refresh-token-ttl=604800
jwt.secret=ThisIsASecretKeyThatMustBeAtLeast32CharactersLong!!

# Verbose Logging for Debugging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.web=DEBUG