server.port=8080

# Production Microservice URLs (Uses internal service names or Load Balancer)
user.service.url=${USER_SERVICE_PROD_URL}

# Database (Injected via Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# JWT Security (Sensitive data must be externalized)
jwt.issuer=leadsphere-auth
jwt.audience=leadsphere-clients
jwt.access-token-ttl=3600
jwt.secret=${JWT_SIGNING_KEY}

# Quiet Logging for Performance
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=ERROR