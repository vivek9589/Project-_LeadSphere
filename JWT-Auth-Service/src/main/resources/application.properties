spring.application.name=JWT-Auth-Service


# Server
server.port=8084


feign.okhttp.enabled=true
user.service.url=http://localhost:8081/sales-user

# MySQL Database Connection

#spring.datasource.url=jdbc:h2:file:./enrollment_DB/enrollment-db
spring.datasource.url=jdbc:mysql://localhost:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Add or update this line
spring.jpa.hibernate.ddl-auto=update


# JWT
jwt.issuer=leadsphere-auth
jwt.audience=leadsphere-clients
jwt.access-token-ttl=900
jwt.refresh-token-ttl=604800
jwt.secret="ThisIsASecretKeyThatMustBeAtLeast32CharactersLong!!"

# eureka configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging (optional, for Feign/Security debugging)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG

logging.level.org.springframework.web=DEBUG


# swagger configuration
springdoc.api-docs.path=/v3/api-docs