services:
  # --- DATABASE ---
  mysqldb:
    image: mysql:8.0
    container_name: leadsphere-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=usersdb
      - MYSQL_ROOT_PASSWORD=password
    volumes:
      - leadsphere_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # --- DISCOVERY SERVER ---
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_HOSTNAME=eureka-server # Fills placeholder in Eureka's dev file
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: on-failure

  # --- API GATEWAY ---
  gateway:
    build: ./Gateway
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_HOST=eureka-server # Fills ${EUREKA_HOST}
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      retries: 3
    restart: always

  # --- JWT AUTH SERVICE ---
  jwt-auth-service:
    build: ./JWT-Auth-Service
    container_name: jwt-auth-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysqldb           # Fills ${DB_HOST}
      - EUREKA_HOST=eureka-server # Fills ${EUREKA_HOST}
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      retries: 3
    restart: always

  # --- USER SERVICE ---
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysqldb
      - EUREKA_HOST=eureka-server
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      retries: 3
    restart: always

  # --- LEAD SERVICE ---
  lead-service:
    build: ./lead-service
    container_name: lead-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysqldb
      - EUREKA_HOST=eureka-server
      - AUTH_HOST=jwt-auth-service # Fills ${AUTH_HOST} used for JWK URI
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    depends_on:
      mysqldb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      retries: 3
    restart: always

  # --- ANALYTICS SERVICE ---
  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_HOST=eureka-server
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      retries: 3
    restart: always

volumes:
  leadsphere_db_data:

networks:
  default:
    name: leadsphere-network