## --- IDENTITY ---
spring.application.name=lead-service

## --- INFRASTRUCTURE (DYNAMIC) ---
# Eureka: Defaults to localhost (IDE), overridden by EUREKA_HOST (Docker)
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database: Defaults to localhost (IDE), overridden by DB_HOST (Docker)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## --- MONITORING ---
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health

## --- COMMON LOGGING ---
logging.level.org.springframework.security=DEBUG