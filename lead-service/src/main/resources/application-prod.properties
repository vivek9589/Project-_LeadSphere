
#########################################################################
server.port=${PORT:8080}

## --- DATABASE (SECURE) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

## --- JPA SETTINGS ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

## --- OAUTH2 / JWT (PROD) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_ISSUER_URI}/protocol/openid-connect/certs

## --- MINIMAL LOGGING ---
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.security.oauth2.jwt=ERROR