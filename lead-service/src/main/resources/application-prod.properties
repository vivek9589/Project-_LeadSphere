server.port=8080

# Production Database (Credentials from Environment Variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA settings (Quiet and restrictive)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# OAuth2 / JWT (Production Identity Provider URL)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_ISSUER_URI}/protocol/openid-connect/certs

# Minimal logging for Production performance
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.security.oauth2.jwt=ERROR