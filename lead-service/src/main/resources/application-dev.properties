server.port=8082

## --- JPA + HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## --- OAUTH2 / JWT DYNAMIC RESOLUTION ---
# IDE: uses localhost:8084. Docker: uses jwt-auth-service:8084
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${AUTH_HOST:localhost}:8084/v3/api-docs

## --- VERBOSE LOGGING ---
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.jwt=TRACE

# Stability for Docker
eureka.instance.prefer-ip-address=${USE_IP:false}