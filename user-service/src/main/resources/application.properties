##########################################################################################
## --- IDENTITY ---
spring.application.name=user-service

## --- INFRASTRUCTURE (DYNAMIC) ---
# Defaults to localhost (IDE), overridden by EUREKA_HOST (Docker)
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# MySQL Connection: Defaults to localhost (IDE), overridden by DB_HOST (Docker)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## --- FILE HANDLING ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

## --- MONITORING ---
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health