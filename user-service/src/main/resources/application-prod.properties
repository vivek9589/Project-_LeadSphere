server.port=8080

# Database (Credentials pulled from Environment)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Settings (Quiet and safe for Prod)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Gmail SMTP (Secrets hidden)
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.debug=false

# Cloudinary (Production Keys)
cloudinary.cloud_name=${PROD_CLOUDINARY_NAME}
cloudinary.api_key=${PROD_CLOUDINARY_KEY}
cloudinary.api_secret=${PROD_CLOUDINARY_SECRET}