## --- IDENTITY ---
spring.application.name=analytics-service

## --- INFRASTRUCTURE ---
# Eureka: In IDE defaults to localhost, in Docker uses the EUREKA_HOST variable
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Database: In IDE defaults to localhost, in Docker uses the DB_HOST variable
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password

## --- PERFORMANCE (2026 Best Practices) ---
spring.threads.virtual.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

## --- MONITORING ---
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health