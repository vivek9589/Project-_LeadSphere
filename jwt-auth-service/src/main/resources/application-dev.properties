server.port=8084

## --- DATABASE SETTINGS ---
spring.jpa.hibernate.ddl-auto=update

## --- JWT SETTINGS (DEV) ---
jwt.issuer=leadsphere-auth-dev
jwt.audience=leadsphere-clients-dev
jwt.access-token-ttl=900
jwt.refresh-token-ttl=604800
# In 2026, ensure this is handled via env var in real dev environments
jwt.secret=ThisIsASecretKeyThatMustBeAtLeast32CharactersLong!!

## --- VERBOSE LOGGING ---
logging.level.org.springframework.security=INFO
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.web=DEBUG
# Ensure this package name matches your actual structure
logging.level.com.braininventory.leadsphere.JWT_Auth_Service.feign=DEBUG

# Stability for Docker internal networking
eureka.instance.prefer-ip-address=${USE_IP:false}