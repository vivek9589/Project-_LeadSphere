## --- IDENTITY ---
spring.application.name=JWT-Auth-Service

## --- INFRASTRUCTURE (DYNAMIC) ---
# Defaults to localhost for IDE, overridden by DB_HOST in Docker
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/usersdb
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Defaults to localhost for IDE, overridden by EUREKA_HOST in Docker
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

## --- FEIGN & DOCS ---
feign.okhttp.enabled=true
springdoc.api-docs.path=/v3/api-docs

## --- MONITORING ---
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health