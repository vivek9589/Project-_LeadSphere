name: Inventotrack Multi-Arch CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push All Services
        run: |
          SERVICES=(
            "analytics-service"
            "eureka-server"
            "gateway"
            "jwt-auth-service"
            "lead-service"
            "user-service"
          )
          
          for SERVICE in "${SERVICES[@]}"; do
            echo "-------------------------------------------------------"
            echo "BUILDING: $SERVICE"
            echo "-------------------------------------------------------"
            cd ./$SERVICE
            mvn clean package -DskipTests
          
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest \
              . --push
            cd ..
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Production Compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.SSH_USER }}/inventotrack/backend"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/inventotrack/backend
            # Rename prod file to standard compose name
            mv docker-compose.prod.yml docker-compose.yml
            # Execute deployment
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f