name: Inventotrack Multi-Arch CI/CD


on:
  push:
    branches: [ "main" ] # Triggers whenever you push code to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Why: Caches dependencies so builds get faster every time.

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        # Why: Enables the x86 runner to "understand" how to build for ARM64.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Why: This creates the virtual "inventobuilder" inside GitHub.

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push All Services
        run: |
          # Professional list of your standardized lowercase folders
          SERVICES=(
            "analytics-service"
            "eureka-server"
            "gateway"
            "jwt-auth-service"
            "lead-service"
            "user-service"
          )
          
          for SERVICE in "${SERVICES[@]}"; do
            echo "-------------------------------------------------------"
            echo "PROCESSING: $SERVICE"
            echo "-------------------------------------------------------"
          
            # Step 1: Compile the JAR inside the specific service folder
            cd ./$SERVICE
            mvn clean package -DskipTests
          
            # Step 2: Build Multi-Arch Docker Image and Push
            # Note: we use '.' as context because we are already inside the folder
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -t ${{ secrets.DOCKER_USERNAME }}/$SERVICE:latest \
              . --push
          
            # Step 3: Return to the root directory for the next iteration
            cd ..
          done

  deploy:
    needs: build-and-push # Why: Ensures we only deploy if the build actually succeeds.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Production Compose to server
      - uses: appleboy/scp-action@master
      - with:
      - host: ${{ secrets.HOST_IP }}
      - username: ${{ secrets.SSH_USER }}
      - key: ${{ secrets.SSH_PRIVATE_KEY }}
      - # Source is the PROD file, but we send it to the backend folder
      - source: "docker-compose.prod.yml"
      - target: "/home/${{ secrets.SSH_USER }}/inventotrack/backend"
        # Why: Syncs your latest container configuration to the Oracle server.

      - name: Deploy via SSH
      - uses: appleboy/ssh-action@v1.0.3
      - with:
      - host: ${{ secrets.HOST_IP }}
      - username: ${{ secrets.SSH_USER }}
      - key: ${{ secrets.SSH_PRIVATE_KEY }}
      - script: |
      - cd /home/${{ secrets.SSH_USER }}/inventotrack/backend
      - # Rename the file on the server so 'docker compose' finds it
      - mv docker-compose.prod.yml docker-compose.yml
      - docker compose pull
      - docker compose up -d --force-recreate
      - docker image prune -f
            # How: 'pull' gets the new images, 'up -d' restarts changed ones, 'prune' saves disk space.